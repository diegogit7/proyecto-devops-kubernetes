name: CI - Build and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t mi-web:v1 .

      - name: Verify image exists
        run: docker images | grep mi-web

      - name: Test image
        run: |
          docker run -d --name test-web -p 8080:80 mi-web:v1
          sleep 3
          curl -f http://localhost:8080 || exit 1
          docker stop test-web
          docker rm test-web

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag image for GHCR (with repo name)
        run: docker tag mi-web:v1 ghcr.io/diegogit7/proyecto-devops-kubernetes/mi-web:v1

      - name: Push image to GHCR
        run: docker push ghcr.io/diegogit7/proyecto-devops-kubernetes/mi-web:v1

      - name: Success message
        run: echo "✅ Imagen publicada en ghcr.io/diegogit7/proyecto-devops-kubernetes/mi-web:v1"
